name: Build NaturalAir De-Esser
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_USE_WIN32_THREADS_INIT=ON
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build build --config Release -j 3
      - name: DSP tests
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure -V 2>&1 | tee ctest.log || {
            echo "ctest failed; running the test binary directly for a clear log";
            f=$(find build -name 'engine_test*' -type f \( -name 'engine_test' -o -name 'engine_test.exe' \) | head -1);
            echo "binary: $f"; "$f" || echo "exit code: $?"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalAir-DeEsser-${{ runner.os }}
          path: |
            build/NaturalAirDeEsser_artefacts/Release/VST3
            build/NaturalAirDeEsser_artefacts/Release/AU
